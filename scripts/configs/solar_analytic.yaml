experiment:
  name: solar_analytic
  seed: 0

dataset:
  name: solar
  train_path: data/solar_data_train.npy
  test_path: data/solar_data_test.npy
  num_chunks: 10

model:
  model_type: svgp
  inducing_strategy: analytic_hippo
  inducing_size: 100
  rff_sample_size: 1000
  step_size: 2.45
  use_robust_cholesky: true

kernel:
  type: se
  input_dim: 1

likelihood:
  type: gaussian
  variance: 0.1

training:
  num_epochs: 1000
  lr: 0.01
  fix_kernel_after_task1: false
