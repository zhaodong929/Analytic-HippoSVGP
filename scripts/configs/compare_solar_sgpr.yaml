experiment:
  name: compare_solar_sgpr
  seed: 0
  mode: compare
  output_dir: results/compare_solar_sgpr
  share_spectral_sample: true

dataset:
  name: solar
  train_path: data/solar_data_train.npy
  test_path: data/solar_data_test.npy
  num_chunks: 10

base:
  model_type: sgpr
  inducing_size: 100
  rff_sample_size: 5000
  step_size: 2.45
  kernel: { type: se, input_dim: 1 }
  training: { num_epochs: 500, lr: 0.01, fix_kernel_after_task1: true }
  exact_gp: { num_epochs: 500, lr: 0.05 }

strategies:
  ode:
    inducing_strategy: hippo_ode
  analytic:
    inducing_strategy: analytic_hippo
