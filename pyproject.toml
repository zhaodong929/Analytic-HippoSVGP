[project]
name = "hippo-svgp"
version = "0.1.0"
description = "HiPPO-based Streaming Variational Gaussian Process"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cdsapi>=0.7.4",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.60.0",
    "xarray>=2022.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hipposvgp"]
