[project]
name = "analytic-hippo-svgp"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch>=2.0",
    "matplotlib",
    "tqdm",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hipposvgp*"]
